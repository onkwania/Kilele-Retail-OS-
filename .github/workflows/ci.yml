# Continuous verification for Kilele Retail OS.
#
# The documentation treats "every requested command was run afresh" as the acceptance method.
# This workflow makes that reproducible instead of manual: no commit reaches `main` without the
# automated suite, TypeScript, ESLint, Prettier, the production build and the Pages output guard.
#
# It deliberately does NOT claim the external gates are closed. KRA eTIMS certification, real
# payment-provider settlement, physical scanner/printer/drawer acceptance and target-host recovery
# drills cannot be executed by a runner and remain documented manual dependencies
# (see docs/HARDWARE_ACCEPTANCE.md and docs/SECOND_PASS_AUDIT.md).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded branch/PR runs are cancelled; a run against main always finishes so the recorded
  # evidence for the protected branch is never truncated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Test, typecheck, lint, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned by the repository, not by a runner default.
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Automated API, client and unit tests
        run: npm run test

      - name: TypeScript (strict, no emit)
        run: npm run typecheck

      - name: ESLint (including react-hooks)
        run: npm run lint

      - name: Prettier formatting
        run: npm run format:check

      - name: Production build (client + compiled server/CLI bundles)
        run: npm run build

      - name: Cloudflare Pages output guard
        run: npm run check:pages

      - name: Runtime dependency advisories
        run: npm audit --omit=dev

      - name: Upload compiled client
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: dist/client
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Real-browser acceptance scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite drives the production-built client over real local HTTPS with disposable
      # in-memory databases. It never touches data/kilele.sqlite or any business record.
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Browser scenarios
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
