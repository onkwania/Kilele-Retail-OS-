# OPTIONAL, NOT CONFIGURED — container deployment template.
#
# Why this no longer runs automatically:
#   1. As shipped by GitHub it triggered on every push to `main`, published an image to ghcr.io and
#      then attempted a deploy against the literal placeholder app name `your-app-name` with an
#      `AZURE_WEBAPP_PUBLISH_PROFILE` secret that does not exist. Every commit therefore produced a
#      red deployment and an unintended public image.
#   2. More importantly, this target contradicts the supported deployment for this application.
#      Kilele is one Node process with a LOCAL PERSISTENT SQLite volume; docs/DEPLOYMENT.md states
#      explicitly: "Do not use ephemeral/serverless storage, NFS/network shares for the SQLite file,
#      or multiple app replicas." Azure Web App for Containers storage is ephemeral and scales
#      horizontally, so a financial ledger placed there can be lost or split on restart/scale-out.
#
# The supported private deployment is deploy/compose.yaml + deploy/Caddyfile on a host with a real
# persistent volume. If you genuinely want a container platform, attach a durable disk/volume to
# /app/data first, prove a backup and a fresh-path restore against it, then fill in the values below
# and switch the trigger back on deliberately.
#
# To configure:
#   1. Set AZURE_WEBAPP_NAME below to your real Azure App Service name.
#   2. Create the AZURE_WEBAPP_PUBLISH_PROFILE repository secret from the Azure Portal publish profile.
#   3. Configure DOCKER_REGISTRY_SERVER_URL / _USERNAME / _PASSWORD app settings for ghcr.io.
#   4. Attach persistent storage for /app/data and verify a restore drill (deploy/backup.sh).

name: Build and deploy a container to an Azure Web App (manual, unconfigured)

env:
  AZURE_WEBAPP_NAME: your-app-name # REQUIRED: set this to the name of your Azure Web App

on:
  # Manual only. This must never fire on an ordinary commit: see the header note.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to run while the template is unconfigured
        env:
          # Deliberately a different name: a step env var must not shadow the value it is checking.
          TARGET_APP: ${{ env.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_APP}" ] || [ "${TARGET_APP}" = "your-app-name" ]; then
            echo "::error::AZURE_WEBAPP_NAME is still the GitHub template placeholder."
            echo "This workflow is an unconfigured optional template. Read its header comment:"
            echo "the supported Kilele deployment is a single process with a persistent local"
            echo "SQLite volume (deploy/compose.yaml), not ephemeral container-app storage."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GitHub container registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Require the publish profile secret
        run: |
          set -euo pipefail
          if [ -z "${AZURE_WEBAPP_PUBLISH_PROFILE:-}" ]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE is not configured."
            exit 1
          fi
        env:
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'ghcr.io/${{ env.REPO }}:${{ github.sha }}'
