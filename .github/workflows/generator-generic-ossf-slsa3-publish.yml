# SLSA provenance for the ACTUAL Kilele deployables.
#
# The original file in this repository was the unmodified GitHub template: it created two dummy
# subjects with `echo "artifact1" > artifact1` and attached SLSA level-3 provenance to them on every
# release. That is worse than no provenance, because it publishes a signed attestation that does not
# describe anything that was really built or shipped.
#
# This version compiles the real artifacts (`npm ci` + `npm run build`) and attests their digests:
# the esbuild server/CLI bundles and the compiled Vite client that Cloudflare Pages or the Node
# process actually serves. Verify with https://github.com/slsa-framework/slsa-verifier.
#
# Scope note: provenance covers build integrity only. It is not a penetration test, not evidence of
# KRA eTIMS certification, and not proof that a deployment host is configured correctly.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # ========================================================
      #
      # Step 1: Build the real artifacts.
      #
      # ========================================================
      - name: Build artifacts
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run check:pages

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: slsa-subjects
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # ========================================================
      #
      # Step 2: Generate the provenance subjects for what was built.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # Attest the compiled server/CLI bundles and the compiled client, never source or data.
          files=$(find dist -type f \
            \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.woff2' -o -name '*.svg' \) \
            | sort)
          test -n "$files"
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: '${{ needs.build.outputs.digests }}'
      upload-assets: true # Optional: Upload to a new release
